name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the version
        run: |
          version=$(python -c "import re;print(re.search(r'\"([^\"]+)\"', open('quorvane/__init__.py').read().split('__version__')[1]).group(1))")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install
        run: pip install -r requirements.txt && sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libopus0 tesseract-ocr
      - name: Tests
        run: python -m unittest
      - name: Notes from the changelog
        run: python scripts/release_notes.py "$VERSION" > notes.md
      - name: Package
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=Quorvane-${VERSION}/ -o dist/Quorvane-${VERSION}.zip HEAD
          (cd dist && sha256sum Quorvane-${VERSION}.zip > Quorvane-${VERSION}.zip.sha256)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "dist/Quorvane-${VERSION}.zip" "dist/Quorvane-${VERSION}.zip.sha256" --title "Quorvane ${VERSION}" --notes-file notes.md
